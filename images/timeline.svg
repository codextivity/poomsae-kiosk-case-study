.h,.h2,.t,.num{fill:#E6EAF0}.s,.lab,.numm{fill:#9AA6B8}.numa{fill:#7EA6EE}.numr{fill:#E06A5F}
.ln{stroke:#8592A6}.lna{stroke:#7EA6EE}.lnr{stroke:#E06A5F}.grid{stroke:#2A3342}
.fa{fill:#7EA6EE}.fm{fill:#4A5568}.fr{fill:#E06A5F}
.bone{stroke:#7EA6EE}.joint{fill:#121720;stroke:#7EA6EE}.jk{fill:#E06A5F}.fov{fill:#7EA6EE;opacity:.08}
.ma{fill:#8592A6}.maa{fill:#7EA6EE}.mar{fill:#E06A5F}}
</style><defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ma" d="M0,0 L10,5 L0,10 z"/></marker><marker id="maa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="maa" d="M0,0 L10,5 L0,10 z"/></marker><marker id="mar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mar" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="960" height="320" rx="12"/><text class="lab" x="20.0" y="30.0">JANUARY – NOVEMBER 2026</text><line class="grid" x1="40.0" y1="46.0" x2="40.0" y2="262.0"/><text class="s" x="44.0" y="60.0">Jan</text><line class="grid" x1="121.9" y1="46.0" x2="121.9" y2="262.0"/><text class="s" x="125.9" y="60.0">Feb</text><line class="grid" x1="195.9" y1="46.0" x2="195.9" y2="262.0"/><text class="s" x="199.9" y="60.0">Mar</text><line class="grid" x1="277.8" y1="46.0" x2="277.8" y2="262.0"/><text class="s" x="281.8" y="60.0">Apr</text><line class="grid" x1="357.1" y1="46.0" x2="357.1" y2="262.0"/><text class="s" x="361.1" y="60.0">May</text><line class="grid" x1="439.0" y1="46.0" x2="439.0" y2="262.0"/><text class="s" x="443.0" y="60.0">Jun</text><line class="grid" x1="518.3" y1="46.0" x2="518.3" y2="262.0"/><text class="s" x="522.3" y="60.0">Jul</text><line class="grid" x1="600.2" y1="46.0" x2="600.2" y2="262.0"/><text class="s" x="604.2" y="60.0">Aug</text><line class="grid" x1="682.2" y1="46.0" x2="682.2" y2="262.0"/><text class="s" x="686.2" y="60.0">Sep</text><line class="grid" x1="761.4" y1="46.0" x2="761.4" y2="262.0"/><text class="s" x="765.4" y="60.0">Oct</text><line class="grid" x1="843.4" y1="46.0" x2="843.4" y2="262.0"/><text class="s" x="847.4" y="60.0">Nov</text><rect class="fa" x="79.6" y="76.0" width="251.1" height="18.0" rx="4"/><text class="t" x="338.7" y="89.0">Movement classifier</text><rect class="fa" x="539.5" y="102.