<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-labelledby="t d"><title id="t">Project timeline</title><desc id="d">Timeline from January to November 2026: movement classifier from January to April, kiosk app from July, live speed and recognition in September, score accuracy from September to October, field-test fixes, and the handover in mid-November, with 12 releases from 1.1.1 to 1.3.8.</desc><style>
