<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" role="img" aria-labelledby="t d"><title id="t">What the AI sees</title><desc id="d">A skeleton with 26 keypoints drawn on one performer, with three facts: 26 keypoints per frame, a 24-frame classifier window, and one performer followed.</desc><style>
