<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" width="960" height="270" role="img" aria-labelledby="t d"><title id="t">Scores now separate skill levels</title><desc id="d">Dot plot: before, a beginner scored 93.8 and an advanced student 96 (2.2 points apart). After connecting the new scoring to the live kiosk path, they scored 86.5 and 92.2 (5.7 points apart).</desc><style>
.bg{fill:#F6F8FB}.card{fill:#FFFFFF;stroke:#C9D2DE;stroke-width:1.5}
.key{fill:#EAF0FA;stroke:#1E4E9C;stroke-width:1.5}.bad{fill:#FBECEA;stroke:#B8322A;stroke-width:1.5}
.side{fill:#FFFFFF;stroke:#8A96A8;stroke-width:1.5;stroke-dasharray:5 4}
.h{font:600 14px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#141A24}
.h2{font:700 17px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#141A24}
.s{font:400 12px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#556173}
.t{font:400 13px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#141A24}
.lab{font:600 11px ui-monospace,Consolas,monospace;fill:#556173;letter-spacing:.06em}
.num{font:700 30px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#141A24}
.numa{font:700 15px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#1E4E9C}
.numm{font:600 13px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#556173}
.numr{font:700 13px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#B8322A}
.ln{stroke:#6B7789;stroke-width:1.5;fill:none}.lna{stroke:#1E4E9C;stroke-width:2;fill:none}
.lnr{stroke:#B8322A;stroke-width:2;fill:none}.grid{stroke:#DCE2EA;stroke-width:1}
.dash{stroke-dasharray:5 4}
.fa{fill:#1E4E9C}.fm{fill:#AEB8C6}.fr{fill:#B8322A}.fc{fill:#FFFFFF;stroke:#C9D2DE;stroke-width:1.5}
.bone{stroke:#1E4E9C;stroke-width:4;stroke-linecap:round;fill:none}
.joint{fill:#FFFFFF;stroke:#1E4E9C;stroke-width:2}.jk{fill:#B8322A}
.zone{fill:#EAF0FA;stroke:#1E4E9C;stroke-width:1.5;stroke-dasharray:5 4}
.mat{fill:#FFFFFF;stroke:#C9D2DE;stroke-width:1.5}.fov{fill:#1E4E9C;opacity:.06}
.ma{fill:#6B7789}.maa{fill:#1E4E9C}.mar{fill:#B8322A}
@media (prefers-color-scheme:dark){
.bg{fill:#121720}.card,.mat,.fc{fill:#1A202B;stroke:#344052}.key,.zone{fill:#1B2A44;stroke:#7EA6EE}
.bad{fill:#3A2024;stroke:#E06A5F}.side{fill:#1A202B;stroke:#6E7A8D}
.h,.h2,.t,.num{fill:#E6EAF0}.s,.lab,.numm{fill:#9AA6B8}.numa{fill:#7EA6EE}.numr{fill:#E06A5F}
.ln{stroke:#8592A6}.lna{stroke:#7EA6EE}.lnr{stroke:#E06A5F}.grid{stroke:#2A3342}
.fa{fill:#7EA6EE}.fm{fill:#4A5568}.fr{fill:#E06A5F}
.bone{stroke:#7EA6EE}.joint{fill:#121720;stroke:#7EA6EE}.jk{fill:#E06A5F}.fov{fill:#7EA6EE;opacity:.08}
.ma{fill:#8592A6}.maa{fill:#7EA6EE}.mar{fill:#E06A5F}}
</style><defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ma" d="M0,0 L10,5 L0,10 z"/></marker><marker id="maa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="maa" d="M0,0 L10,5 L0,10 z"/></marker><marker id="mar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mar" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="960" height="270" rx="12"/><text class="lab" x="20.0" y="30.0">BEGINNER VS ADVANCED STUDENT, SAME FIELD RECORDINGS</text><line class="grid" x1="230.0" y1="50.0" x2="230.0" y2="200.0"/><text class="s" x="230.0" y="220.0" text-anchor="middle">80</text><line class="grid" x1="372.5" y1="50.0" x2="372.5" y2="200.0"/><text class="s" x="372.5" y="220.0" text-anchor="middle">85</text><line class="grid" x1="515.0" y1="50.0" x2="515.0" y2="200.0"/><text class="s" x="515.0" y="220.0" text-anchor="middle">90</text><line class="grid" x1="657.5" y1="50.0" x2="657.5" y2="200.0"/><text class="s" x="657.5" y="220.0" text-anchor="middle">95</text><line class="grid" x1="800.0" y1="50.0" x2="800.0" y2="200.0"/><text class="s" x="800.0" y="220.0" text-anchor="middle">100</text><text class="h" x="20.0" y="92.0">Before</text><text class="s" x="20.0" y="110.0">live path used the old formulas</text><line class="ln" x1="623.3" y1="96.0" x2="686.0" y2="96.0"/><circle class="fc" cx="623.3" cy="96" r="8" style="stroke-width:3"/><circle class="fa" cx="686.0" cy="96" r="8"/><text class="numm" x="623.3" y="80.0" text-anchor="middle">93.8</text><text class="numa" x="686.0" y="80.0" text-anchor="middle">96</text><text class="t" x="830.0" y="101.0">2.2 points apart</text><text class="h" x="20.0" y="162.0">After</text><text class="s" x="20.0" y="180.0">new scoring connected to the kiosk</text><line class="ln" x1="415.2" y1="166.0" x2="577.7" y2="166.0"/><circle class="fc" cx="415.2" cy="166" r="8" style="stroke-width:3"/><circle class="fa" cx="577.7" cy="166" r="8"/><text class="numm" x="415.2" y="150.0" text-anchor="middle">86.5</text><text class="numa" x="577.7" y="150.0" text-anchor="middle">92.2</text><text class="t" x="830.0" y="171.0">5.7 points apart</text><circle class="fc" cx="236" cy="248" r="6" style="stroke-width:3"/><text class="s" x="248.0" y="252.0">beginner</text><circle class="fa" cx="336" cy="248" r="6"/><text class="s" x="348.0" y="252.0">advanced</text></svg>
