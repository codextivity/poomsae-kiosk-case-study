.bone{stroke:#7EA6EE}.joint{fill:#121720;stroke:#7EA6EE}.jk{fill:#E06A5F}.fov{fill:#7EA6EE;opacity:.08}
.ma{fill:#8592A6}.maa{fill:#7EA6EE}.mar{fill:#E06A5F}}
</style><defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ma" d="M0,0 L10,5 L0,10 z"/></marker><marker id="maa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="maa" d="M0,0 L10,5 L0,10 z"/></marker><marker id="mar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mar" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="960" height="312" rx="12"/><text class="lab" x="20.0" y="30.0">ACCURACY SCORE CHANGE WHEN AN ERROR IS INJECTED (AVERAGE OF 16 TEST VIDEOS)</text><line class="grid" x1="230.0" y1="50.0" x2="230.0" y2="250.0"/><text class="s" x="230.0" y="268.0" text-anchor="middle">0</text><line class="grid" x1="360.0" y1="50.0" x2="360.0" y2="250.0"/><text class="s" x="360.0" y="268.0" text-anchor="middle">−1</text><line class="grid" x1="490.0" y1="50.0" x2="490.0" y2="250.0"/><text class="s" x="490.0" y="268.0" text-anchor="middle">−2</text><line class="grid" x1="620.0" y1="50.0" x2="620.0" y2="250.0"/><text class="s" x="620.0" y="268.0" text-anchor="middle">−3</text><line class="grid" x1="750.0" y1="50.0" x2="750.0" y2="250.0"/><text class="s" x="750.0" y="268.0" text-anchor="middle">−4</text><line class="grid" x1="880.0" y1="50.0" x2="880.0" y2="250.0"/><text class="s" x="880.0" y="268.0" text-anchor="middle">−5</text><text class="t" x="20.0" y="86.0">Raised arms</text><rect class="fm" x="230.0" y="66.0" width="26.0" height="16.0" rx="3"/><text class="numm" x="264.0" y="79.0">−0.2</text><rect class="fa" x="230.0" y="86.0" width="312.0" height="16.0" rx="3"/><text class="numa" x="550.0" y="99.0">−2.4</text><text class="t" x="20.0" y="150.0">Narrow stance</text><rect class="fm" x="230.0" y="130.0" width="143.0" height="16.0" rx="3"/><text class="numm" x="381.0" y="143.0">−1.1</text><rect class="fa" x="230.0" y="150.0" width="390.0" height="16.0" rx="3"/><text class="numa" x="628.0" y="163.0">−3.0</text><text class="t" x="20.0" y="214.0">Pose noise (should be 0)</text><rect class="fm" x="230.0" y="194.0" width="2.0" height="16.0" rx="3"/><text class="numm" x="240.0" y="207.0">≈ 0</text><rect class="fa" x="230.0" y="214.0" width="2.0" height="16.0" rx="3"/><text class="numa" x="240.0" y="227.0">≈ 0</text><rect class="fm" x="230.0" y="286.0" width="14.0" height="10.0" rx="2"/><text class="s" x="250.0" y="295.0">before the fixes</text><rect class="fa" x="380.0" y="286.0" width="14.0" height="10.0" rx="2"/><text class="s" x="400.0" y="295.0">after</text></svg>
