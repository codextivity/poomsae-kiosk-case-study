<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" role="img" aria-labelledby="t d"><title id="t">How a guess moves the step bar</title><desc id="d">Each classifier guess passes a ladder of rules: next movement in order with a hold gate, a DTW skip check for jumps of one or two, a held jump, and chain catch-up after a gap. Accepted guesses move the step bar forward; earlier movements are ignored.</desc><style>
.bg{fill:#F6F8FB}.card{fill:#FFFFFF;stroke:#C9D2DE;stroke-width:1.5}
.key{fill:#EAF0FA;stroke:#1E4E9C;stroke-width:1.5}.bad{fill:#FBECEA;stroke:#B8322A;stroke-width:1.5}
.side{fill:#FFFFFF;stroke:#8A96A8;stroke-width:1.5;stroke-dasharray:5 4}
.h{font:600 14px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#141A24}
.h2{font:700 17px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#141A24}
.s{font:400 12px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#556173}
.t{font:400 13px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#141A24}
.lab{font:600 11px ui-monospace,Consolas,monospace;fill:#556173;letter-spacing:.06em}
.num{font:700 30px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#141A24}
.numa{font:700 15px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#1E4E9C}
.numm{font:600 13px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#556173}
.numr{font:700 13px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#B8322A}
.ln{stroke:#6B7789;stroke-width:1.5;fill:none}.lna{stroke:#1E4E9C;stroke-width:2;fill:none}
.lnr{stroke:#B8322A;stroke-width:2;fill:none}.grid{stroke:#DCE2EA;stroke-width:1}
.dash{stroke-dasharray:5 4}
.fa{fill:#1E4E9C}.fm{fill:#AEB8C6}.fr{fill:#B8322A}.fc{fill:#FFFFFF;stroke:#C9D2DE;stroke-width:1.5}
.bone{stroke:#1E4E9C;stroke-width:4;stroke-linecap:round;fill:none}
.joint{fill:#FFFFFF;stroke:#1E4E9C;stroke-width:2}.jk{fill:#B8322A}
.zone{fill:#EAF0FA;stroke:#1E4E9C;stroke-width:1.5;stroke-dasharray:5 4}
.mat{fill:#FFFFFF;stroke:#C9D2DE;stroke-width:1.5}.fov{fill:#1E4E9C;opacity:.06}
.ma{fill:#6B7789}.maa{fill:#1E4E9C}.mar{fill:#B8322A}
@media (prefers-color-scheme:dark){
.bg{fill:#121720}.card,.mat,.fc{fill:#1A202B;stroke:#344052}.key,.zone{fill:#1B2A44;stroke:#7EA6EE}
.bad{fill:#3A2024;stroke:#E06A5F}.side{fill:#1A202B;stroke:#6E7A8D}
.h,.h2,.t,.num{fill:#E6EAF0}.s,.lab,.numm{fill:#9AA6B8}.numa{fill:#7EA6EE}.numr{fill:#E06A5F}
.ln{stroke:#8592A6}.lna{stroke:#7EA6EE}.lnr{stroke:#E06A5F}.grid{stroke:#2A3342}
.fa{fill:#7EA6EE}.fm{fill:#4A5568}.fr{fill:#E06A5F}
.bone{stroke:#7EA6EE}.joint{fill:#121720;stroke:#7EA6EE}.jk{fill:#E06A5F}.fov{fill:#7EA6EE;opacity:.08}
.ma{fill:#8592A6}.maa{fill:#7EA6EE}.mar{fill:#E06A5F}}
</style><defs><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ma" d="M0,0 L10,5 L0,10 z"/></marker><marker id="maa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="maa" d="M0,0 L10,5 L0,10 z"/></marker><marker id="mar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mar" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" x="0" y="0" width="960" height="450" rx="12"/><rect class="card" x="20" y="40" width="200" height="64" rx="8"/><text class="h" x="120.0" y="69.0" text-anchor="middle">Classifier guess</text><text class="s" x="120.0" y="88.0" text-anchor="middle">every frame, smoothed</text><rect class="side" x="20" y="180" width="200" height="64" rx="8"/><text class="h" x="120.0" y="201.0" text-anchor="middle">Earlier movement</text><text class="s" x="120.0" y="220.0" text-anchor="middle">ignored:</text><text class="s" x="120.0" y="236.0" text-anchor="middle">the bar never goes back</text><path class="ln" d="M120.0,104.0 L120.0,178.0" marker-end="url(#ma)"/><rect class="key" x="290" y="40" width="300" height="70" rx="8"/><text class="h" x="440.0" y="72.0" text-anchor="middle">Next movement in order</text><text class="s" x="440.0" y="91.0" text-anchor="middle">hold gate, adapts to confidence</text><path class="lna" d="M590.0,75.0 L676.0,75.0" marker-end="url(#maa)"/><path class="ln" d="M440.0,110.0 L440.0,138.0" marker-end="url(#ma)"/><text class="s" x="450.0" y="130.0">rejected</text><rect class="card" x="290" y="140" width="300" height="70" rx="8"/><text class="h" x="440.0" y="164.0" text-anchor="middle">Jump of 1–2: skip check</text><text class="s" x="440.0" y="183.0" text-anchor="middle">DTW vs the reference band,</text><text class="s" x="440.0" y="199.0" text-anchor="middle">within 3.0 × its p90 tolerance</text><path class="lna" d="M590.0,175.0 L676.0,175.0" marker-end="url(#maa)"/><path class="ln" d="M440.0,210.0 L440.0,238.0" marker-end="url(#ma)"/><text class="s" x="450.0" y="230.0">rejected</text><rect class="card" x="290" y="240" width="300" height="70" rx="8"/><text class="h" x="440.0" y="264.0" text-anchor="middle">Held jump</text><text class="s" x="440.0" y="283.0" text-anchor="middle">held 0.5 s and the head</text><text class="s" x="440.0" y="299.0" text-anchor="middle">faces the right way</text><path class="lna" d="M590.0,275.0 L676.0,275.0" marker-end="url(#maa)"/><path class="ln" d="M440.0,310.0 L440.0,338.0" marker-end="url(#ma)"/><text class="s" x="450.0" y="330.0">rejected</text><rect class="card" x="290" y="340" width="300" height="70" rx="8"/><text class="h" x="440.0" y="364.0" text-anchor="middle">Chain catch-up</text><text class="s" x="440.0" y="383.0" text-anchor="middle">after a gap: held, and the next</text><text class="s" x="440.0" y="399.0" text-anchor="middle">movement in order follows</text><path class="lna" d="M590.0,375.0 L676.0,375.0" marker-end="url(#maa)"/><text class="s" x="600.0" y="68.0">accept</text><path class="ln" d="M220.0,72.0 L288.0,72.0" marker-end="url(#ma)"/><path class="ln" d="M440.0,410.0 L440.0,436.0" marker-end="url(#ma)"/><text class="s" x="452.0" y="432.0">wait for more evidence</text><rect class="card" x="678.0" y="40.0" width="262.0" height="370.0" rx="8"/><text class="h" x="809.0" y="76.0" text-anchor="middle">Step bar moves forward</text><text class="s" x="809.0" y="96.0" text-anchor="middle">one movement at a time, in order</text><rect class="fa" x="700.0" y="130.0" width="34.0" height="34.0" rx="5"/><rect class="fa" x="746.0" y="130.0" width="34.0" height="34.0" rx="5"/><rect class="fa" x="792.0" y="130.0" width="34.0" height="34.0" rx="5"/><rect class="fa" x="838.0" y="130.0" width="34.0" height="34.0" rx="5"/><rect class="fa" x="884.0" y="130.0" width="34.0" height="34.0" rx="5"/><rect class="fa" x="700.0" y="176.0" width="34.0" height="34.0" rx="5"/><rect class="fa" x="746.0" y="176.0" width="34.0" height="34.0" rx="5"/><rect class="fa" x="792.0" y="176.0" width="34.0" height="34.0" rx="5"/><rect class="fa" x="838.0" y="176.0" width="34.0" height="34.0" rx="5"/><rect class="fa" x="884.0" y="176.0" width="34.0" height="34.0" rx="5"/><rect class="fa" x="700.0" y="222.0" width="34.0" height="34.0" rx="5"/><rect class="fr" x="746.0" y="222.0" width="34.0" height="34.0" rx="5"/><rect class="fc" x="792.0" y="222.0" width="34.0" height="34.0" rx="5"/><rect class="fc" x="838.0" y="222.0" width="34.0" height="34.0" rx="5"/><rect class="fc" x="884.0" y="222.0" width="34.0" height="34.0" rx="5"/><rect class="fc" x="700.0" y="268.0" width="34.0" height="34.0" rx="5"/><rect class="fc" x="746.0" y="268.0" width="34.0" height="34.0" rx="5"/><rect class="fc" x="792.0" y="268.0" width="34.0" height="34.0" rx="5"/><rect class="fc" x="838.0" y="268.0" width="34.0" height="34.0" rx="5"/><rect class="fc" x="884.0" y="268.0" width="34.0" height="34.0" rx="5"/><text class="s" x="809.0" y="340.0" text-anchor="middle">blue = recognised</text><text class="s" x="809.0" y="358.0" text-anchor="middle">red = jumped over, counts as 0</text><text class="s" x="809.0" y="376.0" text-anchor="middle">white = still to come</text></svg>
